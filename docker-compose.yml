services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: conradi-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-me-to-a-long-random-string-32-bytes}

  frontend:
    build: ./frontend
    container_name: conradi-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
